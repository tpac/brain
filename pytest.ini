[pytest]
# ─────────────────────────────────────────────────────────────────────────────
# DEFERRED-DAMPENING-CLUSTER (2026-05-30)
#
# The four tests deselected below exercise synaptic fatigue + hub-dampening,
# which are suspected broken since the spreading-activation migration. They are
# PRE-EXISTING failures on `main` (confirmed red on baseline with the DAL-cleanup
# changes stashed — NOT introduced by the DAL work). Parked here, at Tom's
# direction, so the suite stays green while the DAL migration proceeds.
#
# This is a deliberate, authorized deferral — not a silenced failure. The tests
# are still version-controlled and listed explicitly here; nothing is hidden.
# Scheduled for a dedicated fix session (spawned task + brain dampening-cluster
# investigation node). TO UN-PARK: delete the matching --deselect line, then fix
# the dampening code (or update the test contract) — do not just re-enable.
# ─────────────────────────────────────────────────────────────────────────────
addopts =
    --deselect tests/integration/test_recall_pipeline.py::TestRecallPipeline::test_fatigue_accumulates
    --deselect tests/integration/test_recall_pipeline.py::TestRecallPipeline::test_fatigue_dampens_scores
    --deselect tests/integration/test_session_mechanisms.py::Test02_SynapticFatigue::test_fatigue_increments
    --deselect tests/test_recall_quality.py::TestDampening::test_hub_dampening

# ─────────────────────────────────────────────────────────────────────────────
# PER-TEST WALL-CLOCK BACKSTOP (pytest-timeout, dev-only — see requirements-test.txt)
#
# A runaway test FAILS at 120s instead of hanging the whole suite forever. Guards
# the class of bug fixed 2026-06-24: embed_queue._drain_once spun on a
# re-enqueue-into-the-live-queue loop and ran the suite indefinitely. 120s is ~2x
# the slowest legitimate test (the full suite's individual tests all finish well
# under 60s); the signal method (POSIX default) interrupts main-thread CPU/IO
# hangs. Bump a specific slow test locally with @pytest.mark.timeout(N).
#
# Test-only: never shipped — build-plugin.sh excludes tests/ + pytest.ini, and
# pytest-timeout is absent from requirements.txt. Degrades gracefully (an
# "unknown config option" warning, no enforced timeout) if the plugin is missing.
timeout = 120
